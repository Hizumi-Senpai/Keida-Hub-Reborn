name: Reborn foundation
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: reborn-foundation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  foundation:
    name: Rust 1.99.1 / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
        env:
          POSTGRES_USER: reborn_fixture
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: reborn_build
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U reborn_fixture -d reborn_build"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://reborn_fixture:disposable-ci-only@127.0.0.1:5432/reborn_build
      REBORN_TEST_DATABASE_URL: postgresql://reborn_fixture:disposable-ci-only@127.0.0.1:5432/postgres
      PGPASSWORD: disposable-ci-only
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Locked browser tooling and reproducible account script
        working-directory: web
        run: |
          node --version
          npm ci
          npm run check
          npm run check:workspace
          npm run build:account
          npm run build:workspace
          git diff --exit-code -- ../crates/hub/static/account.js ../crates/hub/static/workspace
      - name: Pin toolchain and record actual platform
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc +1.99.1 --version
          uname -a
          psql --version
      - name: Format and derive explicit source identity
        run: |
          cargo +1.99.1 fmt --all --check
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            cargo +1.99.1 run -p reborn-source-identity --locked -- --repo . --candidate "$SOURCE_SHA" --channel accepted --main-ref refs/remotes/origin/main --main-sha "$SOURCE_SHA" --format env >> "$GITHUB_ENV"
          else
            cargo +1.99.1 run -p reborn-source-identity --locked -- --repo . --candidate "$SOURCE_SHA" --channel development --format env >> "$GITHUB_ENV"
          fi
      - name: Recreate compilation schema and check literal queries online
        run: |
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U reborn_fixture -d reborn_build -v ON_ERROR_STOP=1 -f "$migration"
          done
          mkdir "$RUNNER_TEMP/reborn-sqlx"
          SQLX_OFFLINE=false SQLX_OFFLINE_DIR="$RUNNER_TEMP/reborn-sqlx" cargo +1.99.1 check --workspace --all-targets --locked
      - name: Verify checked offline metadata against recreated schema
        run: |
          cat "$RUNNER_TEMP/reborn-sqlx/"*.json
          diff -r .sqlx "$RUNNER_TEMP/reborn-sqlx"
      - name: Locked offline checks and Clippy
        env:
          SQLX_OFFLINE: 'true'
        run: |
          cargo +1.99.1 check --workspace --all-targets --locked
          cargo +1.99.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Real HTTP, PostgreSQL and Git-history contracts
        env:
          SQLX_OFFLINE: 'true'
        run: cargo +1.99.1 test --workspace --all-targets --locked
      - name: Locked release build
        env:
          SQLX_OFFLINE: 'true'
        run: cargo +1.99.1 build --workspace --release --locked
      - name: Build and inspect the exact repository Linux image
        run: |
          docker build --build-arg REBORN_BUILD_PRODUCT --build-arg REBORN_BUILD_VERSION --build-arg REBORN_BUILD_COMMIT --build-arg REBORN_BUILD_TREE --build-arg REBORN_BUILD_ORDINAL --build-arg REBORN_BUILD_CHANNEL --build-arg REBORN_BUILD_CONTRACT --iidfile "$RUNNER_TEMP/reborn-image-id" --tag "reborn-ci:$SOURCE_SHA" .
          mkdir -m 700 "$RUNNER_TEMP/reborn-package"
          target/release/reborn-release inspect-image "$(cat "$RUNNER_TEMP/reborn-image-id")" "$SOURCE_SHA" "$REBORN_BUILD_TREE" "$REBORN_BUILD_VERSION" "$REBORN_BUILD_CHANNEL" "$RUNNER_TEMP/reborn-package"
      - name: Install isolated HTTPS browser prerequisites
        timeout-minutes: 5
        working-directory: web
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 https://archive.ubuntu.com/ubuntu/pool/main/n/nss/libnss3-tools_3.98-1build1_amd64.deb -o "$RUNNER_TEMP/reborn-certutil.deb"
          printf '%s  %s\n' d8d6093edcf2206edeee40eaddd90a54bacc84cde4d8cc9c4fb50bd7aa12cf0d "$RUNNER_TEMP/reborn-certutil.deb" | sha256sum --check --strict
          dpkg-deb -x "$RUNNER_TEMP/reborn-certutil.deb" "$RUNNER_TEMP/reborn-tools"
          printf '%s\n' "$RUNNER_TEMP/reborn-tools/usr/bin" >> "$GITHUB_PATH"
          openssl version
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 90 https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/linux64/chrome-linux64.zip -o "$RUNNER_TEMP/reborn-chrome.zip"
          printf '%s  %s\n' 43fd31766c7533a02dda2ded5ad50c2f861cd5400be7509c0abad71129f79d79 "$RUNNER_TEMP/reborn-chrome.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/reborn-chrome.zip" -d "$RUNNER_TEMP/reborn-chrome"
          "$RUNNER_TEMP/reborn-chrome/chrome-linux64/chrome" --version
          printf 'REBORN_CHROMIUM=%s\nREBORN_BROWSER_EXECUTABLE=%s\n' "$RUNNER_TEMP/reborn-chrome/chrome-linux64/chrome" "$RUNNER_TEMP/reborn-chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Pin native browser driver and execute Rust workspace browser contracts
        env:
          REBORN_BROWSER_BINARY: ${{ github.workspace }}/target/release/keida-hub-reborn
          REBORN_BROWSER_EXPECT_COMMIT: ${{ env.SOURCE_SHA }}
          REBORN_AXE_SCRIPT: ${{ github.workspace }}/web/node_modules/axe-core/axe.min.js
        run: |
          curl --fail --silent --show-error --location --max-time 90 https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/linux64/chromedriver-linux64.zip -o "$RUNNER_TEMP/reborn-chromedriver.zip"
          printf '%s  %s\n' ae36d1b2391e6852594d7dd1be963f818ca05f117cfc5fdcb41c33f3074afa8b "$RUNNER_TEMP/reborn-chromedriver.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/reborn-chromedriver.zip" -d "$RUNNER_TEMP/reborn-chromedriver"
          export REBORN_CHROMEDRIVER="$RUNNER_TEMP/reborn-chromedriver/chromedriver-linux64/chromedriver"
          "$REBORN_CHROMEDRIVER" --version
          cargo +1.99.1 run -p reborn-workspace-browser --release --locked
      - name: Repeat Rust HTTPS browser contracts through the exact packaged image
        env:
          REBORN_BROWSER_BINARY: ${{ github.workspace }}/target/release/keida-hub-reborn
          REBORN_BROWSER_EXPECT_COMMIT: ${{ env.SOURCE_SHA }}
          REBORN_AXE_SCRIPT: ${{ github.workspace }}/web/node_modules/axe-core/axe.min.js
        run: |
          export REBORN_BROWSER_IMAGE="$(cat "$RUNNER_TEMP/reborn-image-id")"
          export REBORN_CHROMEDRIVER="$RUNNER_TEMP/reborn-chromedriver/chromedriver-linux64/chromedriver"
          cargo +1.99.1 run -p reborn-workspace-browser --release --locked
      - name: Rehearse packaged private install and matched PostgreSQL recovery
        run: |
          target/release/reborn-release rehearse-image "$(cat "$RUNNER_TEMP/reborn-image-id")" "$RUNNER_TEMP/reborn-package"
          jq -e '.database_schema == 10 and .fresh_private_claim == true and .restored_native_session_note_and_encrypted_connection == true and .restored_directory_and_personal_pins == true and .restored_activity_and_newer_entries == true and .restored_notifications_and_read_state == true and .restored_personal_layout_and_newer_edits == true and .restored_provider_observations_and_newer_samples == true and .restored_media_connections_and_observations == true and .failed_candidate_preserved_newer_writes == true and .automatic_old_backup_restore == false and .separate_postgresql_instance == true and .runtime_role_cannot_migrate == true and .fixture_only == true' "$RUNNER_TEMP/reborn-package/recovery-proof.json" > /dev/null
      - name: Real Chromium HTTPS account workflows including elapsed form expiry
        working-directory: web
        env:
          REBORN_BROWSER_BINARY: ${{ github.workspace }}/target/release/keida-hub-reborn
          REBORN_BROWSER_EXPECT_COMMIT: ${{ env.SOURCE_SHA }}
          REBORN_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/reborn-browser-safe
        run: npm run test:browser
      - name: Preserve the qualified image and nonsecret artifact proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reborn-linux-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/reborn-package/image.tar
            ${{ runner.temp }}/reborn-package/image-proof.json
            ${{ runner.temp }}/reborn-package/recovery-proof.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Export only explicitly blank account views for visual review
        if: always()
        env:
          REBORN_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/reborn-browser-safe
        run: |
          node --input-type=module <<'JS'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          async function visit(path) {
            for (const entry of await readdir(path, { withFileTypes: true }).catch(() => [])) {
              const file = join(path, entry.name);
              if (entry.isDirectory()) await visit(file);
              else if (/^blank-(claim-desktop|sign-in-mobile)\.png$/.test(entry.name)) {
                const png = await readFile(file);
                if (png.length > 200000) throw new Error('Blank preview exceeds review size');
                process.stdout.write(`SAFE_BLANK_ACCOUNT_PNG ${entry.name} ${png.toString('base64')}\n`);
              }
            }
          }
          await visit(process.env.REBORN_BROWSER_OUTPUT_DIR);
          JS
