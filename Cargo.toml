[workspace]
members = ["crates/hub", "tools/source-identity", "tools/workspace-browser", "tools/crafty-fixture", "tools/release"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
ring = "=0.17.14"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
askama = "=0.16.1"
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower = { version = "=0.5.3", features = ["limit", "timeout", "util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate"] }
url = "=2.5.8"
argon2 = { version = "=0.6.0", features = ["zeroize"] }
getrandom = "=0.4.3"
sha2 = "=0.11.1"
hmac = "=0.13.0"
zeroize = "=1.9.1"
subtle = "=2.6.1"
libc = "=0.2.191"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
