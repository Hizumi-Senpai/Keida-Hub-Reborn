[workspace]
members = ["crates/hub", "tools/source-identity"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "=0.5.3", features = ["limit", "timeout", "util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate"] }
url = "=2.5.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
